name: QA Chat BMZCN calendario y Sin Efecto - sin publicar
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-chat-intencion-policial-20261110.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Obtener commit privado exacto, sin publicar codigo
        uses: actions/checkout@v4
        with:
          repository: kusne/BMZCN
          ref: 09198dda094bdcbcceb5ccaa084feec17ea1a5a6
          token: ${{ secrets.BMZCN_SOURCE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: bmzcn
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar SHA y sintaxis de solo chat
        working-directory: bmzcn
        shell: pwsh
        run: |
          $sha=(git rev-parse HEAD).Trim().ToLowerInvariant()
          if($sha -ne '09198dda094bdcbcceb5ccaa084feec17ea1a5a6') {throw 'Fuente privada distinta de PR #66'}
          node --check app/asistente-conversacion-verificada-v4.js
          node --check app/asistente-personal-puntual-v1.js
          node --check app/asistente-guia-chat-v1.js
          node --check app/asistente-groq-motor-v1.js
          node --check tests/bmzcn-chat-qa-calendario-sin-efecto-max-actas-20261110.test.cjs
          if($LASTEXITCODE -ne 0){throw 'Error sintactico'}
      - name: Instalar dependencias aisladas para regresiones
        working-directory: bmzcn
        shell: pwsh
        run: |
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund --silent
          if($LASTEXITCODE -ne 0){throw 'Dependencias QA fallidas'}
      - name: Probar consultas reproducidas y contratos de agentes
        working-directory: bmzcn
        shell: pwsh
        run: |
          $pruebas=@(
            'tests/bmzcn-chat-qa-calendario-sin-efecto-max-actas-20261110.test.cjs',
            'tests/asistente-guia-chat-v1.test.cjs',
            'tests/asistente-consultas-guardias-v1.test.cjs',
            'tests/asistente-conversacion-verificada-v4.test.cjs',
            'tests/asistente-groq-motor-v1.test.cjs',
            'tests/bmzcn-ia-acceso-obligatorio-v1.test.cjs',
            'tests/bmzcn-ia-flujo-resiliente-v2.test.cjs'
          )
          $fallas=@()
          $log=Join-Path $env:RUNNER_TEMP 'chat-qa-privado.log'
          foreach($prueba in $pruebas){
            node --test $prueba *> $log
            if($LASTEXITCODE -ne 0){
              $fallas += $prueba
              Write-Host ('QA FALLIDA: '+$prueba)
              Get-Content $log | ForEach-Object {
                if($_ -match '^not ok (\d+) - ') { Write-Host ('Caso TAP: '+$Matches[1]) }
                if($_ -match '^\s+(?:code|name):\s*[''"]?([A-Za-z0-9_]+)'){Write-Host ('Error: '+$Matches[1])}
              }
            }else{Write-Host ('QA OK: '+$prueba)}
            Remove-Item $log -Force -ErrorAction SilentlyContinue
          }
          if($fallas.Count){throw ('QA focal fallida: '+$fallas.Count)}
      - name: Validacion integral del contrato de BMZCN
        working-directory: bmzcn
        shell: pwsh
        run: |
          npm run test:blindaje:preflight
          if($LASTEXITCODE -ne 0){throw 'Blindaje preflight fallido'}
          $pruebas=@(node scripts/arquitectura/puerta-calidad-publicacion-bmzcn.cjs --listar)
          if($LASTEXITCODE -ne 0 -or $pruebas.Count -lt 100){throw 'Catalogo QA incompleto'}
          $fallidas=@()
          $log=Join-Path $env:RUNNER_TEMP 'qa-bmzcn-integral.log'
          foreach($prueba in $pruebas){
            if($prueba -notmatch '^tests/[A-Za-z0-9_.-]+\.test\.(?:cjs|mjs)$'){throw 'Ruta de prueba invalida'}
            node --test $prueba *> $log
            if($LASTEXITCODE -ne 0){
              $fallidas += $prueba
              Write-Host ('REGRESION FALLIDA: '+$prueba)
              Get-Content $log | ForEach-Object {
                if($_ -match '^not ok (\d+) - '){Write-Host ('TAP: '+$Matches[1])}
              }
            }
            Remove-Item $log -Force -ErrorAction SilentlyContinue
          }
          if($fallidas.Count){throw ('Regresiones fallidas: '+$fallidas.Count)}
          Write-Host ('QA integral aprobada: '+$pruebas.Count+' archivos, sin publicacion.')
