# Electron Windows BMZCN main ea2b692af903fbcddaf126d04b2e7efb2a3f285a: RETIRO hora real y personal FINALIZADO.
# Certificación de Electron Windows BMZCN main 0dcfe0401f83aa67155f8e7e13d4047b30737d2a (FINALIZADO V2, contingencia y cierre 06h).
# Certificación Windows de BMZCN main 2fbfaf0e9eac3fb3228d20c0dd20b0055aa591bb (FINALIZADO V2 y cierre automático guardia 06:00).
# Certificación Electron Windows BMZCN main dc57d4f36c3da67cfbfb7e1c7a6ec79b48d33318 RETIRO institucional sin RECURSOS RETIRADOS PR #71.
# Certificación del ejecutable Windows BMZCN main d340e839fa44f9dab4e58063641b586ca82306d8 (edición integral de todos los eventos PR #70).
# Certificación Electron Windows BMZCN main 894895bdecb9a5084e3d31294768a1d8a3185d90 edición de movimientos PR #69.
# Certificación Electron de BMZCN main 734afa90d99fc544d3ebb3b8d4686ae18638d03b (reparación eventos PR #68).
# Solicitud de certificación Electron del origen privado BMZCN main 90f4693dbc8c340559aee0c35688cbcb05c0aaf9 (PR #67).
# Certificación de BMZCN@main 9935803ebcfed87764cb4f656779c963414f0d76 (PR #66, calendario y actas), 2026-11-10.
# QA corrección formato institucional Dirección BMZCN main 5093586ecb4d40bc292548a5b32748364dc78e47
# Certificación chat dos agentes para BMZCN main a0a9d200183de9be1239d8ebe788a24249f0106f
# Revalidación por push del SHA privado certificado: 2e2ee84ee19667429d85eba28c8a7bbab31c4959 (10/11/2026)
name: Certificar Electron Windows sin publicar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certificacion-electron-windows-bmzcn.yml'
permissions:
  contents: read
concurrency:
  group: certificacion-electron-windows
  cancel-in-progress: true
jobs:
  empaquetado:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Descargar rama de certificación privada (solo lectura)
        uses: actions/checkout@v4
        with:
          repository: kusne/BMZCN
          ref: main
          token: ${{ secrets.BMZCN_SOURCE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: bmzcn
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias aisladas del programa y Filtro
        shell: pwsh
        working-directory: bmzcn
        run: |
          $ErrorActionPreference='Stop'
          npm install --no-package-lock --no-audit --no-fund --silent
          if ($LASTEXITCODE -ne 0) { throw 'Falló instalación de dependencias Electron.' }
          npm ci --prefix app/filtro-ordenes/servicio-local --no-audit --no-fund --silent
          if ($LASTEXITCODE -ne 0) { throw 'Falló instalación local de Filtro-Órdenes.' }
      - name: Validar seguridad y contratos antes del empaquetado
        shell: pwsh
        working-directory: bmzcn
        run: |
          node scripts/arquitectura/puerta-calidad-publicacion-bmzcn.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Catálogo no válido.' }
          npm run test:blindaje:preflight
          if ($LASTEXITCODE -ne 0) { throw 'Arquitectura/IPC inválidos.' }
          node --test tests/electron-ventana-windows-smoke-contrato.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Contrato de smoke inválido.' }
          node --test tests/electron-sesion-autenticacion-simulada-20261108.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Contrato de smoke inválido.' }
      - name: Construir recursos internos de Estadísticas
        shell: pwsh
        working-directory: bmzcn
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'stats-build.log'
          npm run predist:win *> $log
          $resultado=$LASTEXITCODE
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          if ($resultado -ne 0) { throw 'Fallo preparando recursos de Estadísticas.' }
      - name: Empaquetar Windows sin instalador ni publicación
        shell: pwsh
        working-directory: bmzcn
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'bmzcn-dir-build.log'
          npx --no-install electron-builder --win --dir --publish never *> $log
          $resultado=$LASTEXITCODE
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          if ($resultado -ne 0) { throw 'No se pudo empaquetar directorio win-unpacked.' }
          if (-not (Test-Path 'dist/win-unpacked')) { throw 'No se generó carpeta Windows sin instalar.' }
      - name: Comprobar Filtro local empaquetado en ejecutable real
        shell: pwsh
        working-directory: bmzcn
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'filtro-smoke.log'
          node tests/filtro-instalador-windows-smoke.cjs *> $log
          $resultado=$LASTEXITCODE
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          if ($resultado -ne 0) { throw 'El backend y frontend de Filtro-Órdenes no superan el arranque empaquetado.' }
          Write-Host 'Filtro-Órdenes: servidor y frontend locales funcionales en Windows.'
      - name: Comprobar ventana Electron real, login e IPC
        shell: pwsh
        working-directory: bmzcn
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'electron-ventana-smoke.log'
          node tests/electron-ventana-windows-smoke.cjs *> $log
          $resultado=$LASTEXITCODE
          if ($resultado -ne 0) {
            Get-Content $log | Where-Object { $_ -match '^CERTIFICACIÓN WINDOWS' } |
              Select-Object -First 3 | ForEach-Object { Write-Host ([string]$_).Substring(0,[Math]::Min(250,([string]$_).Length)) }
          }
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          if ($resultado -ne 0) { throw 'La ventana Electron no superó su certificación.' }
          Write-Host 'Ventana Electron empaquetada: 7 módulos, login, preload e IPC correctos.'
      - name: Garantizar que no se publicó ni se creó instalador NSIS
        shell: pwsh
        working-directory: bmzcn
        run: |
          if (@(Get-ChildItem -Path dist -File -Filter '*.exe').Count -gt 0) {
            throw 'Se detectó un instalador cuando solo se autorizó el ejecutable desempaquetado.'
          }
          if (Test-Path 'dist/latest.yml') { throw 'No debe generarse un feed de actualización.' }
          Write-Host 'Certificación sin release, sin instalador y sin credenciales de producción.'
      - name: Registrar SHA de ejecutable certificado sin datos privados
        if: success()
        id: evidencia
        shell: pwsh
        working-directory: bmzcn
        run: |
          $sha=(git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'No se puede certificar SHA inválido.' }
          "source_sha=$sha" >> $env:GITHUB_OUTPUT
          $resumen=@{
            source_sha=$sha
            source_ref='main'
            result='success'
            scope='electron-windows-unpacked-login-filtro-preload-ipc'
            run_id="$env:GITHUB_RUN_ID"
          }
          $archivo=Join-Path $env:RUNNER_TEMP 'bmzcn-electron-evidencia.json'
          $resumen | ConvertTo-Json -Compress | Set-Content -Path $archivo -Encoding UTF8
      - name: Certificar ejecutable Windows real para el mismo SHA de main
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bmzcn-electron-main-${{ steps.evidencia.outputs.source_sha }}
          path: ${{ runner.temp }}/bmzcn-electron-evidencia.json
          if-no-files-found: error
          retention-days: 14
