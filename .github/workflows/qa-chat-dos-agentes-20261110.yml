name: QA chat BMZCN dos agentes - temporal sin publicar
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-chat-dos-agentes-20261110.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Obtener rama privada sin exponer código
        uses: actions/checkout@v4
        with:
          repository: kusne/BMZCN
          ref: 854dfe0eb400f5e0e497ef4f82fc3227ddd5ee08
          token: ${{ secrets.BMZCN_SOURCE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: bmzcn
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar commit y contrato sintáctico
        working-directory: bmzcn
        shell: pwsh
        run: |
          $sha=(git rev-parse HEAD).Trim().ToLowerInvariant()
          if($sha -ne '854dfe0eb400f5e0e497ef4f82fc3227ddd5ee08') { throw 'Fuente no es el SHA verificado' }
          node --check app/bmzcn-ia-ambito-v1.js
          node --check app/bmzcn-ia-acceso-obligatorio-v1.js
          node --check app/asistente-groq-motor-v1.js
          if($LASTEXITCODE -ne 0) { throw 'Sintaxis inválida' }
      - name: Pruebas de dos agentes, dominio, contexto, seguridad y chat
        working-directory: bmzcn
        shell: pwsh
        run: |
          $pruebas=@(
            'tests/bmzcn-ia-acceso-obligatorio-v1.test.cjs',
            'tests/bmzcn-ia-flujo-resiliente-v2.test.cjs',
            'tests/chat-natural-saludos.test.cjs',
            'tests/bmzcn-ia-lecturas-con-supervisor-degradado.test.cjs',
            'tests/bmzcn-ia-tres-agentes-reales.test.cjs',
            'tests/bmzcn-ia-bitacora-v1.test.cjs',
            'tests/bmzcn-chat-envio-no-bloqueo.test.cjs',
            'tests/asistente-groq-motor-v1.test.cjs',
            'tests/chat-vista-mensajeria.test.cjs',
            'tests/bmzcn-ia-coordinador-v1.test.cjs'
          )
          $fallidas=@()
          $log=Join-Path $env:RUNNER_TEMP 'qa-bmzcn-chat-privado.log'
          foreach($prueba in $pruebas) {
            node --test $prueba *> $log
            if($LASTEXITCODE -ne 0) {
              $fallidas += $prueba
              Write-Host ('FALLO: '+$prueba)
              Get-Content $log | ForEach-Object {
                if($_ -match '^not ok (\d+) - ') { Write-Host ('TAP '+$Matches[1]+': '+$_.Substring(0,[Math]::Min(155,$_.Length))) }
                if($_ -match '^\s+(?:code|name|operator):\s*[''"]?([A-Za-z0-9_]+)') { Write-Host ('Categoria: '+$Matches[1]) }
              }
            }else{Write-Host ('OK: '+$prueba)}
            Remove-Item $log -Force -ErrorAction SilentlyContinue
          }
          if($fallidas.Count){throw ('QA chat fallida: '+$fallidas.Count+' archivos')}
      - name: Verificar contratos generales
        working-directory: bmzcn
        shell: pwsh
        run: |
          npm run test:blindaje:preflight
          if($LASTEXITCODE -ne 0){throw 'Falló contrato de blindaje'}
          Write-Host 'QA BMZCN dos agentes aprobada. Sin instalador ni publicación.'
