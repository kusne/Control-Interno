# QA final PR #73: impedir segunda finalización tras cron a las 06:00 y probar rechazo.
# QA PR73: eliminar referencia a API localStorage prohibida por verificador de fronteras.
# QA RETIRO sin bloque: actualizar regresión legacy y validar ambas representaciones.
# QA FINAL PR70 SHA 16a4ce0b29bc45ff353d3221c3d70633901c2981: compatibilidad eventos V2 sin updatedAt legacy.
# Certificación PR #70 SHA d8870b9525c962f4af67b1d1c93f94555f5b4ebb: preservar informe principal de procedimientos.
# QA editor integral: INICIO, CONTROL SUPERIOR, ACOPLE vinculado, PROCEDIMIENTO e historial.
# QA PR #69: incluir anterior en alcance correcto de evento local y comprobar protección sin identidad.
# Tercera corrida: prueba de evento histórico sin adaptador legacy ajeno a movimientos.
# Segunda corrida QA de eventos: controlador de guardia compartido, identidad de Enter y regresiones corregidas.
# Certificación de BMZCN@main 9935803ebcfed87764cb4f656779c963414f0d76 (PR #66, calendario y actas), 2026-11-10.
# QA corrección formato institucional Dirección BMZCN main 5093586ecb4d40bc292548a5b32748364dc78e47
# Certificación chat dos agentes para BMZCN main a0a9d200183de9be1239d8ebe788a24249f0106f
# Revalidación por push del SHA privado certificado: 2e2ee84ee19667429d85eba28c8a7bbab31c4959 (10/11/2026)
name: QA integral BMZCN sin publicar instalador
# Certificación posterior a fusión de pruebas de escritorio BMZCN 2a3a823a.
# Solo lectura. Valida fuentes privadas sin construir paquetes ni crear releases.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Rama o SHA privada que se desea verificar sin publicar'
        type: string
        required: false
        default: main
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-bmzcn-privado-sin-publicar.yml'
concurrency:
  group: qa-bmzcn-privado-sin-publicacion
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  calidad:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Verificar acceso de solo lectura al repositorio privado
        shell: pwsh
        env:
          SOURCE_TOKEN: ${{ secrets.BMZCN_SOURCE_READ_TOKEN }}
        run: |
          if (-not $env:SOURCE_TOKEN) { throw 'No se puede ejecutar QA sin la credencial de lectura.' }
      - name: Descargar rama de QA sin persistir credenciales
        uses: actions/checkout@v4
        with:
          repository: kusne/BMZCN
          # Con push se verifica main; manualmente admite rama o SHA privada.
          ref: ${{ inputs.source_ref || 'main' }}
          token: ${{ secrets.BMZCN_SOURCE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: bmzcn
      - name: Registrar SHA exacto y origen de pruebas
        id: origen
        shell: pwsh
        working-directory: bmzcn
        env:
          SOURCE_REF: ${{ inputs.source_ref || 'main' }}
        run: |
          $sha=(git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'SHA privado no verificable.' }
          $clase = if ($env:SOURCE_REF -eq 'main') { 'main' } else { 'rama' }
          "source_sha=$sha" >> $env:GITHUB_OUTPUT
          "ref_kind=$clase" >> $env:GITHUB_OUTPUT
          Write-Host ('Origen privado identificado, tipo: ' + $clase)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias JavaScript sin ejecutar instaladores
        shell: pwsh
        working-directory: bmzcn
        run: |
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund --silent
          if ($LASTEXITCODE -ne 0) { throw 'Dependencias de QA no disponibles.' }
      - name: Comprobar catálogo unificado, contratos y sintaxis
        shell: pwsh
        working-directory: bmzcn
        run: |
          $ErrorActionPreference='Stop'
          node scripts/arquitectura/puerta-calidad-publicacion-bmzcn.cjs
          if ($LASTEXITCODE -ne 0) { throw 'La puerta de calidad detectó un catálogo incompleto.' }
          npm run test:blindaje:preflight
          if ($LASTEXITCODE -ne 0) { throw 'Preflight de arquitectura fallido; no se autoriza publicar.' }
      - name: Ejecutar TODAS las regresiones del catálogo, sin imprimir datos privados
        shell: pwsh
        working-directory: bmzcn
        run: |
          $ErrorActionPreference='Stop'
          $pruebas = @(node scripts/arquitectura/puerta-calidad-publicacion-bmzcn.cjs --listar)
          if ($LASTEXITCODE -ne 0 -or $pruebas.Count -lt 100) {
            throw 'Catálogo de pruebas incompleto; QA cerrada.'
          }
          $log = Join-Path $env:RUNNER_TEMP 'bmzcn-qa-private.log'
          $fallidas = @()
          foreach ($prueba in $pruebas) {
            if ($prueba -notmatch '^tests/[A-Za-z0-9_.-]+\.test\.(?:cjs|mjs)$') {
              throw 'Ruta de pruebas no autorizada.'
            }
            node --test $prueba *> $log
            if ($LASTEXITCODE -ne 0) {
              $fallidas += $prueba
              # Solo ruta de test, nunca contenidos de fuentes ni valores de clientes.
              Write-Host ('REGRESIÓN FALLIDA: ' + $prueba)
              # Solo índices TAP y categorías de error, nunca mensajes, datos,
              # valores actual/expected, fuentes privadas ni stack traces.
              Get-Content $log | ForEach-Object {
                if ($_ -match '^not ok (\d+) - ') {
                  Write-Host ('Caso de prueba fallido: ' + $Matches[1])
                }
                if ($_ -match '^  (?:code|name|operator):\s*[''"]?([A-Za-z0-9_]+)') {
                  Write-Host ('Categoria tecnica: ' + $Matches[1])
                }
              }
            }
            Remove-Item $log -Force -ErrorAction SilentlyContinue
          }
          if ($fallidas.Count -gt 0) {
            throw ('QA BLOQUEADA: ' + $fallidas.Count + ' archivos de prueba fallaron.')
          }
          Write-Host ('QA VERDE: ' + $pruebas.Count + ' archivos de prueba aprobados.')
      - name: Diagnosticar cruces arquitectónicos sin filtrar código ni datos
        if: always()
        shell: pwsh
        working-directory: bmzcn
        run: |
          foreach ($archivo in @('app/stats/Herramientas/verificar-arquitectura.js',
                                  'app/filtro-ordenes/backend/servicios/verificar-arquitectura.js')) {
            $lineas = & node $archivo 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host ('ARQUITECTURA OK: ' + $archivo)
            } else {
              Write-Host ('ARQUITECTURA NO VÁLIDA: ' + $archivo)
              $lineas | Where-Object { $_ -match '^\s*-\s+\S' } | Select-Object -First 40 | ForEach-Object {
                # Los verificadores solo generan ruta de archivo y nombre de regla.
                $detalle = ([string]$_).Trim()
                Write-Host ('Frontera: ' + $detalle.Substring(0,[Math]::Min(180,$detalle.Length)))
              }
              $lineas | ForEach-Object {
                $linea = ([string]$_).Trim()
                if ($linea -match '^(?:Error|TypeError|SyntaxError|ReferenceError|RangeError):\s*([^\r\n]+)') {
                  $mensaje = $Matches[1]
                  Write-Host ('Error técnico del verificador: ' + $mensaje.Substring(0,[Math]::Min(145,$mensaje.Length)))
                }
                if ($linea -match '\b(ENOENT|MODULE_NOT_FOUND|ERR_MODULE_NOT_FOUND|ERR_INVALID_ARG_TYPE)\b') {
                  Write-Host ('Codigo técnico: ' + $Matches[1])
                }
              }
            }
          }
          exit 0
      - name: Confirmar ausencia de publicación
        shell: pwsh
        run: Write-Host 'QA completada sin crear instalador, modificar Supabase ni publicar release.'
      - name: Emitir evidencia mínima de QA aprobada
        if: success()
        shell: pwsh
        working-directory: bmzcn
        env:
          SOURCE_REF: ${{ inputs.source_ref || 'main' }}
          SOURCE_SHA: ${{ steps.origen.outputs.source_sha }}
        run: |
          $count=@(node scripts/arquitectura/puerta-calidad-publicacion-bmzcn.cjs --listar).Count
          if ($LASTEXITCODE -ne 0 -or $count -lt 100) { throw 'No se permite certificar un catálogo incompleto.' }
          $prueba = @{
            source_sha = $env:SOURCE_SHA
            source_ref = $env:SOURCE_REF
            test_files = $count
            qa_result = 'success'
            run_id = "$env:GITHUB_RUN_ID"
          }
          $evidencia=Join-Path $env:RUNNER_TEMP 'bmzcn-qa-evidencia.json'
          $prueba | ConvertTo-Json -Compress | Set-Content -Path $evidencia -Encoding UTF8
          Write-Host ('Evidencia mínima lista: ' + $count + ' tests, sin código ni datos de usuarios.')
      - name: Registrar evidencia de QA para publicar solo el SHA probado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bmzcn-qa-${{ steps.origen.outputs.ref_kind }}-${{ steps.origen.outputs.source_sha }}
          path: ${{ runner.temp }}/bmzcn-qa-evidencia.json
          if-no-files-found: error
          retention-days: 14
